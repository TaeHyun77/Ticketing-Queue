version: "2.4"

services:
  queueing-back-1:
    build: .
    image: local/queueing:latest
    container_name: queueing01
    cpuset: "0,1"
    cpus: 2.0
    mem_limit: 1.5g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9292/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - SERVER_NAME=queueing01
      - JAVA_OPTS=-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    ports:
      - "8081:8081"
    depends_on:
      redis-sentinel01:
        condition: service_healthy
      redis-sentinel02:
        condition: service_healthy
      redis-sentinel03:
        condition: service_healthy
    networks:
      - integrated-net

  nginx:
    image: nginx:latest
    container_name: integrated-nginx
    cpuset: "7"
    cpus: 1.0
    ports:
      - "8079:90"
    volumes:
      - ./nginx.1node.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      queueing-back-1:
        condition: service_healthy
    networks:
      - integrated-net

  # --- Redis Master-Slave + Sentinel ---
  redis-master:
    image: "bitnami/redis:latest"
    hostname: redis-master
    container_name: queue-redis-master
    cpuset: "6"
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
      # 정상 복제본이 1개 미만이면 쓰기를 거부하여 failover 유실 창을 복제 지연(최대 10초)으로 상한
      - REDIS_EXTRA_FLAGS=--min-replicas-to-write 1 --min-replicas-max-lag 10
    ports:
      - "6379:6379"
    volumes:
      # AOF 영속화 (컨테이너 재생성 시에도 데이터 유지, 빈 마스터 재동기화로 인한 전체 유실 방지)
      - redis-master-data:/bitnami/redis/data
    networks:
      - integrated-net

  redis-slave01:
    image: "bitnami/redis:latest"
    hostname: redis-slave01
    container_name: queue-redis-slave01
    cpuset: "6"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_REPLICATION_MODE=slave
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_MASTER_HOST=redis-master
      # failover로 마스터 승격 시에도 동일한 쓰기 거부 정책을 유지하기 위해 slave에도 적용
      - REDIS_EXTRA_FLAGS=--min-replicas-to-write 1 --min-replicas-max-lag 10
    ports:
      - "6479:6379"
    volumes:
      - redis-slave01-data:/bitnami/redis/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - integrated-net

  redis-slave02:
    image: "bitnami/redis:latest"
    hostname: redis-slave02
    container_name: queue-redis-slave02
    cpuset: "6"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_REPLICATION_MODE=slave
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_MASTER_HOST=redis-master
      # failover로 마스터 승격 시에도 동일한 쓰기 거부 정책을 유지하기 위해 slave에도 적용
      - REDIS_EXTRA_FLAGS=--min-replicas-to-write 1 --min-replicas-max-lag 10
    ports:
      - "6579:6379"
    volumes:
      - redis-slave02-data:/bitnami/redis/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - integrated-net

  redis-sentinel01:
    image: 'bitnami/redis-sentinel:latest'
    hostname: redis-sentinel01
    container_name: queue-redis-sentinel01
    cpuset: "6"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=60000
      - REDIS_SENTINEL_PARALLEL_SYNCS=2
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=toMaster
      - REDIS_SENTINEL_QUORUM=2
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave01:
        condition: service_healthy
      redis-slave02:
        condition: service_healthy
    ports:
      - '26379:26379'
    networks:
      - integrated-net

  redis-sentinel02:
    image: 'bitnami/redis-sentinel:latest'
    hostname: redis-sentinel02
    container_name: queue-redis-sentinel02
    cpuset: "6"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=60000
      - REDIS_SENTINEL_PARALLEL_SYNCS=2
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=toMaster
      - REDIS_SENTINEL_QUORUM=2
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave01:
        condition: service_healthy
      redis-slave02:
        condition: service_healthy
    ports:
      - '26380:26379'
    networks:
      - integrated-net

  redis-sentinel03:
    image: 'bitnami/redis-sentinel:latest'
    hostname: redis-sentinel03
    container_name: queue-redis-sentinel03
    cpuset: "6"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=60000
      - REDIS_SENTINEL_PARALLEL_SYNCS=2
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=toMaster
      - REDIS_SENTINEL_QUORUM=2
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave01:
        condition: service_healthy
      redis-slave02:
        condition: service_healthy
    ports:
      - '26381:26379'
    networks:
      - integrated-net

  # --- 모니터링 ---
  airdnb-prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpuset: "7"
    volumes:
      - ./prometheus.1node.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - queueing-back-1
    networks:
      - integrated-net

  airdnb-local-grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpuset: "7"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    depends_on:
      - airdnb-prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - integrated-net

networks:
  integrated-net:

volumes:
  grafana-data:
  redis-master-data:
  redis-slave01-data:
  redis-slave02-data:
