worker_processes auto;
# 워커당 동시 커넥션 상한보다 OS fd 한도가 커야 하므로 함께 상향
worker_rlimit_nofile 65535;

events {
    # SSE 연결 1개당 클라이언트/업스트림 커넥션 2개를 소비하므로, 대기자 규모를 고려해 넉넉히
    worker_connections 16384;
}

http {
    log_format timing '$remote_addr - $request_time $upstream_response_time $status $request';
    access_log /var/log/nginx/access.log timing;

    keepalive_timeout 60;
    keepalive_requests 1000;

    # 대기열 서버
    upstream queueing-cluster { # 서버 묶음 정의
        server queueing-back-1:8081 weight=1 max_fails=3 fail_timeout=10s;
        server queueing-back-2:8081 weight=1 max_fails=3 fail_timeout=10s;
        server queueing-back-3:8081 weight=1 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # 예약 서버 (예약 프로젝트 미기동 시 upstream DNS 해석 실패로 nginx가 죽으므로 비활성화)
    # upstream reserve-cluster {
    #     server reserve-1:8080 weight=1 max_fails=3 fail_timeout=10s;
    #     server reserve-2:8080 weight=1 max_fails=3 fail_timeout=10s;
    #     keepalive 32;
    # }

    server {
        listen 90;

        # 모든 location 공통 프록시 설정 (proxy_* 지시어는 하위 location으로 상속되며, 필요한 location에서만 재정의)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s; # 일반 API 기본값, SSE만 아래에서 덮어쓴다

        # SSE 엔드포인트 - 장시간 연결 유지
        location /queue/stream {
            proxy_pass http://queueing-cluster;

            # 실시간 스트림이 버퍼에 갇히지 않도록 버퍼링/캐시 비활성화, 침묵 구간이 길어도 끊기지 않도록 read 타임아웃 상향
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # 대기열 API
        location /queue/ { # 이 경로의 요청들은 정의된 proxy_pass 묶음으로 라우팅
            proxy_pass http://queueing-cluster;
        }

        # 예약 API (슬래시 유무 모두 매칭)
        # location /reserve {
        #     proxy_pass http://reserve-cluster;
        # }

        # 기본 라우팅
        location / {
            proxy_pass http://queueing-cluster;
        }
    }
}
