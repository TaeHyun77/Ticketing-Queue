version: "2.4"

services:
  queueing:
    build: .
    image: local/queueing-standalone:latest
    container_name: queueing-standalone
    cpus: 2.0
    mem_limit: 5g
    # 다수 SSE 연결이 컨테이너 기본 FD 한도(1024)에 막히지 않도록 상향 — soak의 핵심 전제
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9292/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - SERVER_NAME=standalone
      - JAVA_OPTS=-Xms3g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      # 부하 테스트 중 register/promote INFO 로그가 디스크를 채우고 I/O 오버헤드를 유발하므로 WARN으로 억제
      - LOGGING_LEVEL_COM_EXAMPLE_INTEGRATED=WARN
    # 컨테이너 로그가 무한히 커져 디스크를 채우지 않도록 회전 상한
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "8081:8081"
      - "9292:9292"
    depends_on:
      redis-standalone:
        condition: service_healthy
    networks:
      - standalone-net

  redis-standalone:
    image: "bitnami/redis:latest"
    hostname: redis-standalone
    container_name: queue-redis-standalone
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6380:6379"
    networks:
      - standalone-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-standalone
    volumes:
      - ./prometheus.standalone.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - queueing
    networks:
      - standalone-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-standalone
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-standalone-data:/var/lib/grafana
    networks:
      - standalone-net

networks:
  standalone-net:

volumes:
  grafana-standalone-data:
